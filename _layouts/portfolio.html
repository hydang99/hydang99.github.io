<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    {% include head/custom.html %}
    <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="academic-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header shell">
      <a class="wordmark" href="{{ '/' | relative_url }}">Hy Dang</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publication' %} aria-current="{% if page.url == '/publications/' %}page{% else %}location{% endif %}"{% endif %}>Publications</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
        <a href="{{ '/blogs/' | relative_url }}"{% if page.url contains '/blogs/' %} aria-current="{% if page.url == '/blogs/' %}page{% else %}location{% endif %}"{% endif %}>Blog</a>
        <a href="{{ '/misc/' | relative_url }}"{% if page.url == '/misc/' %} aria-current="page"{% endif %}>Personal</a>
      </nav>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer shell">
      <span>Hy Dang · University of Notre Dame</span>
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
    </footer>
    {% if jekyll.environment == 'production' %}{% include analytics.html %}{% endif %}
  </body>
</html>
